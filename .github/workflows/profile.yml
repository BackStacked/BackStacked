name: profile

# Rebuilds the images on the output branch and the "Recently shipped" list.
# GitHub pauses scheduled workflows after 60 days without repo activity; if
# that happens, re-enable it from the Actions tab.
on:
  schedule:
    - cron: "23 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.config.json
      - assets/**
      - scripts/**
      - .github/workflows/profile.yml

permissions:
  contents: read

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  images:
    name: Build images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Private repos only feed totals (contributions, repo count, language
      # mix); no private repo name is ever written into an image.
      - name: Render banner, cards, stack and logo
        run: node scripts/build-images.ts dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          PROFILE_TOKEN_SWAPZYCC: ${{ secrets.PROFILE_TOKEN_SWAPZYCC }}
          PROFILE_TOKEN_GRABZY_CC: ${{ secrets.PROFILE_TOKEN_GRABZY_CC }}

      - name: Render contribution snake
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#09090b&color_dots=#ebedf0,#d4d4d8,#a1a1aa,#52525b,#09090b
            dist/snake-dark.svg?palette=github-dark&color_snake=#fafafa&color_dots=#161b22,#3f3f46,#71717a,#a1a1aa,#fafafa

      - name: Check every image the README uses was built
        run: node scripts/check-readme.ts --dist dist

      # One orphan commit, force-pushed: the output branch never grows a history.
      - name: Publish to the output branch
        working-directory: dist
        run: |
          git init --quiet --initial-branch=output
          git add --all
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --message "Build images from ${GITHUB_SHA::7}"
          git push --quiet --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
        env:
          GITHUB_TOKEN: ${{ github.token }}

  feed:
    name: Refresh recently shipped
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # github.token only, never PROFILE_TOKEN: this list is public, so it is
      # built with a token that cannot see private repos at all.
      - name: Update the feed from public repos
        run: node scripts/update-feed.ts README.md
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit if it changed
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "Refresh recently shipped" README.md
          git pull --quiet --rebase
          git push --quiet
